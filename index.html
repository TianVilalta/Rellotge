<!DOCTYPE html>
<html lang="ca">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Galeria</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 100%; height: 100%;
    overflow: hidden;
    background: #3b3b3b;
  }
  /* ── IMATGE PRINCIPAL (ocupa tot l'espai disponible, sense marges) ── */
  #main-preview {
    position: fixed;
    top: 0; left: 0; right: 0;
    bottom: 110px; /* deixa espai només per la barra de miniatures */
    overflow: hidden; /* evita que el scale del fade deixi vores buides */
  }
  #main-preview img {
    position: absolute;
    top: 0; left: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: center;
    display: block;
    transition: opacity 0.35s ease, transform 0.5s cubic-bezier(0.16,1,0.3,1);
  }
  #main-preview img.fade {
    opacity: 0;
    transform: scale(1.06); /* una mica més gran per no deixar vores en fer zoom */
  }
  /* ── BARRA DE MINIATURES ── */
  .thumb-bar {
    position: fixed;
    bottom: 0; left: 0; right: 0;
    height: 110px;
    background: rgba(20,20,20,0.55);
    backdrop-filter: blur(6px);
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    padding: 10px 16px;
    z-index: 10;
  }
  /* miniatures */
  .thumb-btn {
    width: 82px;
    height: 82px;
    padding: 0;
    border: 2px solid transparent;
    background: #2a2a2a;
    cursor: pointer;
    overflow: hidden;
    position: relative;
    flex-shrink: 0;
    transition: border-color 0.25s;
  }
  .thumb-btn img {
    width: 100%; height: 100%;
    object-fit: cover;
    display: block;
    filter: brightness(0.55);
    transition: filter 0.3s, transform 0.3s;
  }
  .thumb-btn:hover img { filter: brightness(0.82); transform: scale(1.06); }
  .thumb-btn.active { border-color: rgba(255,255,255,0.75); }
  .thumb-btn.active img { filter: brightness(1); }
</style>
</head>
