<!DOCTYPE html>
<html lang="ca">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Galeria</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 100%; height: 100%;
    overflow: hidden;
    background: #3b3b3b;
  }
  #main-preview {
    position: fixed;
    top: 0; left: 0; right: 0;
    bottom: 110px;
    overflow: hidden;
  }
  #main-preview img {
    position: absolute;
    top: 0; left: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: center;
    display: block;
    transition: opacity 0.35s ease, transform 0.5s cubic-bezier(0.16,1,0.3,1);
  }
  #main-preview img.fade {
    opacity: 0;
    transform: scale(1.06);
  }
  .thumb-bar {
    position: fixed;
    bottom: 0; left: 0; right: 0;
    height: 110px;
    background: rgba(20,20,20,0.55);
    backdrop-filter: blur(6px);
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    padding: 10px 16px;
    z-index: 10;
  }
  .thumb-btn {
    width: 82px;
    height: 82px;
    padding: 0;
    border: 2px solid transparent;
    background: #2a2a2a;
    cursor: pointer;
    overflow: hidden;
    position: relative;
    flex-shrink: 0;
    transition: border-color 0.25s;
  }
  .thumb-btn img {
    width: 100%; height: 100%;
    object-fit: cover;
    display: block;
    filter: brightness(0.55);
    transition: filter 0.3s, transform 0.3s;
  }
  .thumb-btn:hover img { filter: brightness(0.82); transform: scale(1.06); }
  .thumb-btn.active { border-color: rgba(255,255,255,0.75); }
  .thumb-btn.active img { filter: brightness(1); }
</style>
</head>
<body>
<div id="main-preview">
  <img id="main-img" src="images/imatge1.png" alt="Imatge principal">
</div>
<div class="thumb-bar">
  <button class="thumb-btn active" data-index="0"><img src="images/imatge1.png" alt="1"></button>
  <button class="thumb-btn" data-index="1"><img src="images/imatge2.png" alt="2"></button>
  <button class="thumb-btn" data-index="2"><img src="images/imatge3.png" alt="3"></button>
  <button class="thumb-btn" data-index="3"><img src="images/imatge4.png" alt="4"></button>
</div>
<script>
  const images = [
    'images/imatge1.png',
    'images/imatge2.png',
    'images/imatge3.png',
    'images/imatge4.png',
  ];
  let current = 0;
  let autoTimer = null;
  const AUTO_INTERVAL = 5000;
  const mainImg   = document.getElementById('main-img');
  const thumbBtns = document.querySelectorAll('.thumb-btn');

  function select(index, resetTimer = true) {
    const next = ((index % images.length) + images.length) % images.length;
    current = next;
    thumbBtns.forEach(b => b.classList.remove('active'));
    thumbBtns[current].classList.add('active');
    mainImg.classList.add('fade');
    setTimeout(() => {
      mainImg.src = images[current];
      mainImg.classList.remove('fade');
    }, 320);
    if (resetTimer) restartAutoRotate();
  }

  function startAutoRotate() {
    autoTimer = setInterval(() => select(current + 1, false), AUTO_INTERVAL);
  }
  function restartAutoRotate() {
    clearInterval(autoTimer);
    startAutoRotate();
  }

  thumbBtns.forEach(btn =>
    btn.addEventListener('click', () => select(+btn.dataset.index))
  );
  document.addEventListener('keydown', e => {
    if (e.key === 'ArrowLeft')  select(current - 1);
    if (e.key === 'ArrowRight') select(current + 1);
  });

  startAutoRotate();
</script>
</body>
</html>
